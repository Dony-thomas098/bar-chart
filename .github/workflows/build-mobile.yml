name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CAPACITOR_BUILD: 'true'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://xatrvpgoxywaxjpfydtj.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_GxnEWSL_npNPsO0DmCHkVg_IhVF1g3l' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_GxnEWSL_npNPsO0DmCHkVg_IhVF1g3l' }}
  NEXT_PUBLIC_LIVE_UPDATE_URL: 'https://raw.githubusercontent.com/Dony-thomas098/bar-chart/main/public/update.json'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Next.js Static Export
        run: npm run build:cap

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Package OTA Live Update Bundle
        run: npm run ota:pack

      - name: Upload OTA Update Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Chordly-OTA-Update
          path: |
            dist-mobile/bundle.zip
            dist-mobile/update.json

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordly-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (OTA Update & APK)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ota-latest >/dev/null 2>&1; then
            gh release upload ota-latest \
              dist-mobile/bundle.zip \
              dist-mobile/update.json \
              android/app/build/outputs/apk/debug/app-debug.apk \
              --clobber
          else
            gh release create ota-latest \
              dist-mobile/bundle.zip \
              dist-mobile/update.json \
              android/app/build/outputs/apk/debug/app-debug.apk \
              --title "Chordly Live Update" \
              --notes "Automated OTA bundle and Android APK release"
          fi

      - name: Commit & push updated manifest to main
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/update.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ota): sync OTA update manifest [skip ci]" && git push)


  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export & Sync iOS
        run: npm run build:cap

      - name: Check Xcode Version
        run: xcodebuild -version

      - name: Build iOS Archive (Simulator / Unsigned)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            TARGET_FLAG="-project App.xcodeproj"
          fi
          xcodebuild clean archive \
            $TARGET_FLAG \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package iOS IPA (Unsigned)
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -qr Chordly.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chordly-iOS
          path: |
            ios/App/build/Chordly.ipa
            ios/App/build/App.xcarchive
