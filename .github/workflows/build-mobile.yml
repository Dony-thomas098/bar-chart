name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CAPACITOR_BUILD: 'true'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build:cap

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordly-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export & Sync iOS
        run: npm run build:cap

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build iOS Archive (Simulator / Unsigned)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild clean archive \
              -workspace App.xcworkspace \
              -scheme App \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild clean archive \
              -project App.xcodeproj \
              -scheme App \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Upload iOS Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: Chordly-iOS-Archive
          path: ios/App/build/App.xcarchive
