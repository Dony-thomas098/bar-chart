        </div>

        <div class="section-header-row">
          <h3 class="section-heading"><span>📝</span> Lyrics Folders (${LYRICS_FOLDERS.length})</h3>
          <span class="section-action-btn" onclick="openCreateLyricsFolderModal()">+ Create Folder</span>
        </div>

        <div class="folders-cards-grid">
          ${LYRICS_FOLDERS.map(f => `
            <div class="visual-folder-card" onclick="openLyricsFolder('${f.id}')">
              <div class="folder-art-cover" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));">
                <span class="folder-top-pill">${f.count} Sheets</span>
                <div class="folder-center-icon">${f.icon}</div>
              </div>
              <div>
                <div class="folder-title-text">${escapeHtml(f.name)}</div>
                <div class="folder-subtitle-text">${f.updated}</div>
              </div>
              <div class="folder-footer-row">
                <span class="folder-count-badge">${f.count} Lyrics</span>
                <div class="folder-open-arrow">→</div>
              </div>
            </div>
          `).join('')}

          <div class="folder-card-new-visual" onclick="openCreateLyricsFolderModal()">
            <div style="font-size: 26px;">📁+</div>
            <div style="font-weight: 700; font-size: 13.5px; color: white;">Create Folder</div>
            <div style="font-size: 11px; color: var(--text-muted);">Organize stage lyrics</div>
          </div>
        </div>
      `;
    }

    function openLyricsFolder(folderId) {
      switchView('lyrics', { folderId, sheetId: null });
    }

    let selectedLyricsFolderIcon = '📝';
    function openCreateLyricsFolderModal() {
      const existing = document.getElementById('createLyricsFolderModal');
      if (existing) existing.remove();

      selectedLyricsFolderIcon = '📝';
      const icons = ['📝', '⛪', '📖', '🎤', '🎵', '🎼', '🌟', '🎸', '🎹', '🔥'];

      const modal = document.createElement('div');
      modal.id = 'createLyricsFolderModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-dialog" onclick="event.stopPropagation()">
          <div class="modal-title">
            <span>📝 Create Lyrics Folder</span>
            <button style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;" onclick="closeCreateLyricsFolderModal()">✕</button>
          </div>
          <div>
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Folder Name</label>
            <input type="text" id="newLyricsFolderName" class="modal-input" placeholder="e.g. Sunday Worship, Gospel Hymns, Youth Set" autofocus />
          </div>
          <div>
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Pick Icon</label>
            <div class="modal-icons-row" id="lyricsFolderIconPicker">
              ${icons.map(ic => `
                <button type="button" class="modal-icon-pill ${ic === selectedLyricsFolderIcon ? 'selected' : ''}" onclick="selectLyricsFolderIcon('${ic}', this)">${ic}</button>
              `).join('')}
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
            <button class="btn-flow-nav" onclick="closeCreateLyricsFolderModal()">Cancel</button>
            <button class="btn-flow-nav btn-flow-next" onclick="saveNewLyricsFolder()">Create Folder</button>
          </div>
        </div>
      `;
      modal.onclick = closeCreateLyricsFolderModal;
      document.body.appendChild(modal);
      setTimeout(() => {
        const inp = document.getElementById('newLyricsFolderName');
        if (inp) inp.focus();
      }, 50);
    }

    function selectLyricsFolderIcon(icon, btn) {
      selectedLyricsFolderIcon = icon;
      document.querySelectorAll('#lyricsFolderIconPicker .modal-icon-pill').forEach(b => b.classList.remove('selected'));
      if (btn) btn.classList.add('selected');
    }

    function closeCreateLyricsFolderModal() {
      const modal = document.getElementById('createLyricsFolderModal');
      if (modal) modal.remove();
    }

    function saveNewLyricsFolder() {
      const inp = document.getElementById('newLyricsFolderName');
      const name = inp ? inp.value.trim() : '';
      if (!name) {
        showToast('Please enter a folder name');
        return;
      }
      const newFolder = {
        id: 'lyrics-folder-' + Date.now(),
        name: name,
        icon: selectedLyricsFolderIcon || '📝',
        count: 0,
        updated: 'Just now'
      };
      LYRICS_FOLDERS.unshift(newFolder);
      closeCreateLyricsFolderModal();
      renderLyricsFoldersView();
      showToast(`Created lyrics folder "${name}"`);
    }

    function renderInsideLyricsFolderView(folderId) {
      updateFolderCounts();
      const mount = document.getElementById('viewMountPoint');
      if (!mount) return;
      const f = LYRICS_FOLDERS.find(folder => folder.id === folderId) || LYRICS_FOLDERS[0];
      const sheets = LYRICS_SHEETS.filter(s => s.folderId === folderId);

      mount.innerHTML = `
        <div class="view-breadcrumb-header" style="justify-content: space-between;">
          <div style="display:flex; align-items:center; gap:10px;">
            <button class="btn-back-crumb" onclick="switchView('lyrics', { mode: 'folders' })">← All Lyrics Folders</button>
            <span style="font-size: 18px;">${f.icon}</span>
            <span style="font-size: 15px; font-weight: 700; color: white;">${escapeHtml(f.name)}</span>
            <span class="folder-count-badge">${sheets.length} Sheets</span>
          </div>
          <button class="section-action-btn" onclick="openAddLyricsSheetModal('${f.id}')">+ Add Lyrics Sheet</button>
        </div>

        <div class="song-cards-grid">
          <!-- Add Lyrics Sheet card -->
          <div class="folder-card-new-visual" onclick="openAddLyricsSheetModal('${f.id}')" style="min-height: 110px; cursor: pointer;">
            <div style="font-size: 24px; color: var(--accent);">+ 📝</div>
            <div style="font-weight: 700; font-size: 13px; color: white;">Add Lyrics Sheet</div>
            <div style="font-size: 11px; color: var(--text-muted);">Paste or compose lyrics</div>
          </div>

          ${sheets.map(s => {
            const firstLines = (s.body || '').split('\n').filter(l => l.trim() && !l.toUpperCase().includes('VERSE') && !l.toUpperCase().includes('CHORUS')).slice(0, 2).join(' • ');
            return `
              <div class="song-card" onclick="openLyricsSheetPrompter(${s.id})">
                <div class="song-card-header-row">
                  <span class="song-card-key-pill" style="background:rgba(99,102,241,0.2); color:#a5b4fc; border-color:rgba(99,102,241,0.3);">LYRICS</span>
                  <div style="display:flex; align-items:center; gap:6px;">
                    <button class="header-btn" style="width:24px; height:24px; font-size:11px;" title="Delete sheet" onclick="event.stopPropagation(); deleteLyricsSheet(${s.id})">✕</button>
                  </div>
                </div>
                <div>
                  <div class="song-title-text">${escapeHtml(s.title)}</div>
                  <div class="song-artist-text">${escapeHtml(s.artist)}</div>
                  <div style="font-size: 11.5px; color: #94a3b8; margin-top: 6px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                    ${escapeHtml(firstLines || 'Tap to view lyrics...')}
                  </div>
                </div>
                <div class="song-footer-row">
                  <span class="folder-count-badge" style="font-size:10.5px;">🎤 Stage Prompter</span>
                  <div style="color: var(--text-faint); font-weight: 700;">→</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function openLyricsSheetPrompter(sheetId) {
      switchView('lyrics', { sheetId });
    }

    function deleteLyricsSheet(sheetId) {
      const idx = LYRICS_SHEETS.findIndex(s => s.id === sheetId);
      if (idx !== -1) {
        const deleted = LYRICS_SHEETS.splice(idx, 1)[0];
        updateFolderCounts();
        renderInsideLyricsFolderView(currentLyricsFolderId);
        showToast(`Deleted "${deleted.title}"`);
      }
    }

    function openAddLyricsSheetModal(folderId) {
      const existing = document.getElementById('addLyricsSheetModal');
      if (existing) existing.remove();

      const f = LYRICS_FOLDERS.find(folder => folder.id === folderId) || LYRICS_FOLDERS[0];

      const modal = document.createElement('div');
      modal.id = 'addLyricsSheetModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-dialog" onclick="event.stopPropagation()">
          <div class="modal-title">
            <span>📝 Add Lyrics to "${escapeHtml(f.name)}"</span>
            <button style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;" onclick="closeAddLyricsSheetModal()">✕</button>
          </div>
          <div>
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Song Title</label>
            <input type="text" id="newLyricsTitle" class="modal-input" placeholder="e.g. Goodness of God, Build My Life" autofocus />
          </div>
          <div style="margin-top:8px;">
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Artist</label>
            <input type="text" id="newLyricsArtist" class="modal-input" placeholder="e.g. Bethel Music, Housefires" value="Worship Band" />
          </div>
          <div style="margin-top:8px;">
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Lyrics Text (Include VERSE, CHORUS tags)</label>
            <textarea id="newLyricsBody" class="modal-input" rows="8" style="resize:vertical; font-family:inherit; font-size:12.5px; line-height:1.4;" placeholder="VERSE 1&#10;Your grace is enough...&#10;&#10;CHORUS&#10;Great is Your faithfulness..."></textarea>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
            <button type="button" class="btn-flow-nav" onclick="prefillFromChordSong('${folderId}')" style="font-size:11px;">⚡ Import from Chords</button>
            <div style="display:flex; gap:8px;">
              <button class="btn-flow-nav" onclick="closeAddLyricsSheetModal()">Cancel</button>
              <button class="btn-flow-nav btn-flow-next" onclick="submitCreateLyricsSheet('${f.id}')">Save Lyrics</button>
            </div>
          </div>
        </div>
      `;
      modal.onclick = closeAddLyricsSheetModal;
      document.body.appendChild(modal);
    }

    function prefillFromChordSong(folderId) {
      const curSong = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      const titleInput = document.getElementById('newLyricsTitle');
      const artistInput = document.getElementById('newLyricsArtist');
      const bodyInput = document.getElementById('newLyricsBody');
      if (titleInput) titleInput.value = curSong.title;
      if (artistInput) artistInput.value = curSong.artist;
      if (bodyInput) {
        bodyInput.value = `VERSE 1\n${curSong.title} - Verse lyrics here...\n\nCHORUS\nSing hallelujah, praise the Lord...\n\nVERSE 2\nSecond verse lyrics...`;
      }
      showToast(`Imported details from "${curSong.title}"`);
    }

    function closeAddLyricsSheetModal() {
      const modal = document.getElementById('addLyricsSheetModal');
      if (modal) modal.remove();
    }

    function submitCreateLyricsSheet(folderId) {
      const titleInput = document.getElementById('newLyricsTitle');
      const artistInput = document.getElementById('newLyricsArtist');
      const bodyInput = document.getElementById('newLyricsBody');

      const title = (titleInput && titleInput.value.trim()) || 'Untitled Lyrics';
      const artist = (artistInput && artistInput.value.trim()) || 'Composer';
      const body = (bodyInput && bodyInput.value.trim()) || 'VERSE 1\n(Lyrics content...)';

      const newSheet = {
        id: Date.now(),
        folderId: folderId,
        title: title,
        artist: artist,
        body: body
      };

      LYRICS_SHEETS.unshift(newSheet);
      closeAddLyricsSheetModal();
      updateFolderCounts();
      openLyricsSheetPrompter(newSheet.id);
      showToast(`Added "${title}" to lyrics`);
    }

    function renderLyricsSheetPrompterView(sheetId) {
      const mount = document.getElementById('viewMountPoint');
      if (!mount) return;
      const sheet = LYRICS_SHEETS.find(s => s.id === sheetId) || LYRICS_SHEETS[0];
      const folder = LYRICS_FOLDERS.find(f => f.id === sheet.folderId) || LYRICS_FOLDERS[0];
      const matchingSong = SONGS.find(s => s.title.toLowerCase() === sheet.title.toLowerCase());

      // Format body text with formatted section badges
      const formattedLines = sheet.body.split('\n').map(line => {
        const trimmed = line.trim();
        if (/^(VERSE|CHORUS|BRIDGE|INTRO|OUTRO|PRE-CHORUS|HOOK|TAG|REFRAIN)/i.test(trimmed)) {
          return `<div style="font-weight: 800; font-size: 13px; color: #818cf8; letter-spacing: 0.08em; margin: 18px 0 6px; padding: 2px 8px; background: rgba(99,102,241,0.15); border-radius: 4px; display: inline-block;">${escapeHtml(trimmed.toUpperCase())}</div>`;
        }
        if (!trimmed) {
          return `<div style="height: 10px;"></div>`;
        }
        return `<div>${escapeHtml(trimmed)}</div>`;
      }).join('');

      mount.innerHTML = `
        <div class="view-breadcrumb-header" style="justify-content: space-between; flex-wrap: wrap; gap: 8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="btn-back-crumb" onclick="switchView('lyrics', { folderId: '${folder.id}', sheetId: null })">← ${escapeHtml(folder.name)}</button>
            <span style="font-size: 14px; font-weight: 700; color: white;">${escapeHtml(sheet.title)}</span>
            <span style="font-size: 12px; color: var(--text-muted);">${escapeHtml(sheet.artist)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="control-chip-btn" id="btnAutoScroll" onclick="toggleLyricsAutoScroll()">▶ Auto-Scroll</button>
            <button class="control-chip-btn" onclick="adjustLyricsFontSize(-1)" title="Smaller text">A−</button>
            <button class="control-chip-btn" onclick="adjustLyricsFontSize(1)" title="Larger text">A+</button>
            <button class="control-chip-btn" onclick="openEditLyricsModal(${sheet.id})">✎ Edit</button>
            ${matchingSong ? `<button class="control-chip-btn" onclick="openSongChart(${matchingSong.id})">🎼 Chords</button>` : ''}
          </div>
        </div>

        <div id="lyricsPrompterCard" style="background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 24px; font-size: ${lyricsFontSize}px; line-height: 1.85; color: #f1f5f9; min-height: 60vh;">
          ${formattedLines}
        </div>
      `;
    }

    function toggleLyricsAutoScroll() {
      const btn = document.getElementById('btnAutoScroll');
      if (lyricsAutoScrollTimer) {
        clearInterval(lyricsAutoScrollTimer);
        lyricsAutoScrollTimer = null;
        if (btn) btn.textContent = '▶ Auto-Scroll';
        showToast('Auto-scroll paused');
      } else {
        lyricsAutoScrollTimer = setInterval(() => {
          window.scrollBy({ top: 1, behavior: 'auto' });
        }, 50);
        if (btn) btn.textContent = '⏸ Pause Scroll';
        showToast('Auto-scroll started');
      }
    }

    function adjustLyricsFontSize(delta) {
      lyricsFontSize = Math.max(12, Math.min(32, lyricsFontSize + delta));
      const card = document.getElementById('lyricsPrompterCard');
      if (card) card.style.fontSize = `${lyricsFontSize}px`;
    }

    function openEditLyricsModal(sheetId) {
      const sheet = LYRICS_SHEETS.find(s => s.id === sheetId);
      if (!sheet) return;

      const existing = document.getElementById('editLyricsModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'editLyricsModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-dialog" onclick="event.stopPropagation()">
          <div class="modal-title">
            <span>✎ Edit Lyrics: "${escapeHtml(sheet.title)}"</span>
            <button style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;" onclick="closeEditLyricsModal()">✕</button>
          </div>
          <div>
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Title</label>
            <input type="text" id="editLyricsTitle" class="modal-input" value="${escapeHtml(sheet.title)}" />
          </div>
          <div style="margin-top:8px;">
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Artist</label>
            <input type="text" id="editLyricsArtist" class="modal-input" value="${escapeHtml(sheet.artist)}" />
          </div>
          <div style="margin-top:8px;">
            <label style="font-size:11px; color:#94a3b8; font-weight:700; text-transform:uppercase; display:block; margin-bottom:4px;">Lyrics Text</label>
            <textarea id="editLyricsBody" class="modal-input" rows="10" style="resize:vertical; font-family:inherit; font-size:13px; line-height:1.4;">${escapeHtml(sheet.body)}</textarea>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
            <button class="btn-flow-nav" onclick="closeEditLyricsModal()">Cancel</button>
            <button class="btn-flow-nav btn-flow-next" onclick="saveEditedLyrics(${sheet.id})">Save Changes</button>
          </div>
        </div>
      `;
      modal.onclick = closeEditLyricsModal;
      document.body.appendChild(modal);
    }

    function closeEditLyricsModal() {
      const modal = document.getElementById('editLyricsModal');
      if (modal) modal.remove();
    }

    function saveEditedLyrics(sheetId) {
      const sheet = LYRICS_SHEETS.find(s => s.id === sheetId);
      if (!sheet) return;
      const titleInput = document.getElementById('editLyricsTitle');
      const artistInput = document.getElementById('editLyricsArtist');
      const bodyInput = document.getElementById('editLyricsBody');

      if (titleInput && titleInput.value.trim()) sheet.title = titleInput.value.trim();
      if (artistInput && artistInput.value.trim()) sheet.artist = artistInput.value.trim();
      if (bodyInput && bodyInput.value.trim()) sheet.body = bodyInput.value.trim();

      closeEditLyricsModal();
      renderLyricsSheetPrompterView(sheet.id);
      showToast('Lyrics updated');
    }

    function handleLyricsSearch(val) {
      const q = val.trim().toLowerCase();
      if (!q) { renderLyricsFoldersView(); return; }
      const results = LYRICS_SHEETS.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q) || s.body.toLowerCase().includes(q));
      const mount = document.getElementById('viewMountPoint');
      mount.innerHTML = `
        <div class="section-header-row">
          <h3 class="section-heading">Lyrics Search: "${escapeHtml(val)}" (${results.length} found)</h3>
          <span class="section-action-btn" onclick="renderLyricsFoldersView()">Back to Folders</span>
        </div>
        <div class="song-cards-grid">
          ${results.map(s => `
            <div class="song-card" onclick="openLyricsSheetPrompter(${s.id})">
              <div class="song-card-header-row"><span class="song-card-key-pill">LYRICS</span></div>
              <div class="song-title-text">${escapeHtml(s.title)}</div>
              <div class="song-artist-text">${escapeHtml(s.artist)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleStar(id) {
      const song = SONGS.find(s => s.id === id);
      if (song) {
        song.starred = !song.starred;
        showToast(song.starred ? `★ Starred: ${song.title}` : `Removed star`);
      }
    }

    function handleSearch(val) {
      const q = val.trim().toLowerCase();
      if (!q) { renderFoldersView(); return; }
      const results = SONGS.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
      const mount = document.getElementById('viewMountPoint');
      mount.innerHTML = `
        <div class="section-header-row">
          <h3 class="section-heading">Search: "${escapeHtml(val)}" (${results.length} found)</h3>
          <span class="section-action-btn" onclick="switchView('folders')">Clear</span>
        </div>
        <div class="song-cards-grid">
          ${results.map(s => `
            <div class="song-card" onclick="openSongChart(${s.id})">
              <div class="song-card-header-row"><span class="song-card-key-pill">KEY ${s.key}</span></div>
              <div class="song-title-text">${s.title}</div>
              <div class="song-artist-text">${s.artist}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function setDeviceView(mode) {
      const vp = document.getElementById('viewportContainer');
      const deskBtn = document.getElementById('btnDeskView');
      const mobBtn = document.getElementById('btnMobView');

      if (mode === 'mobile') {
        vp.classList.add('mobile-frame');
        deskBtn.classList.remove('active');
        mobBtn.classList.add('active');
        // On mobile view, automatically show the mobile editor (Image 2) if in chord reader
        if (currentView === 'chord_reader') {
          chartViewMode = 'edit';
          const bottomDock = document.getElementById('bottomDock');
          if (bottomDock) bottomDock.style.display = 'none';
          renderChordReaderView();
        }
        showToast('📱 Mobile Frame');
      } else {
        vp.classList.remove('mobile-frame');
        mobBtn.classList.remove('active');
        deskBtn.classList.add('active');
        showToast('💻 Desktop View Mode');
      }
    }

    function openNewChartModal() {
      const title = prompt("Enter title for new chart:", "New Song");
      if (!title) return;
      const newSong = {
        id: Date.now(),
        title: title,
        artist: "Composer",
        key: "C",
        bpm: 120,
        time: "4/4",
        capo: 0,
        folderId: currentFolderId || "sunday",
        starred: false,
        sheetLines: [
          { label: "A Section:", labelColor: "color-intro", startBar: "||", bars1: ["-", "-", "-", "-"], midBar: "||", bars2: ["-", "-", "-", "-"], endBar: "||" }
        ],
        sections: [
          {
            name: "A section",
            notes: "",
            lines: [
              ["-", "-", "-", "-"],
              ["-", "-", "-", "-"]
            ]
          }
        ]
      };
      SONGS.unshift(newSong);
      if (!openTabs.includes(newSong.id)) openTabs.push(newSong.id);
      switchView('chord_reader', { songId: newSong.id });
      showToast(`Created blank chart "${title}"`);
    }

    function showToast(msg) {
      const toast = document.getElementById('toastPopup');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Initial render on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      switchView('chord_reader', { songId: 101 });
    });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      switchView('chord_reader', { songId: 101 });
    }
  </script>
</body>
</html>
