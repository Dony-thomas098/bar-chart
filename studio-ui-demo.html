<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChordCraft — Professional Studio Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Lora:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Curated Professional Dark Studio Palette */
      --bg: #09090b;
      --bg-surface: #121216;
      --bg-surface-elevated: #181820;
      --bg-card: rgba(18, 18, 24, 0.85);
      --bg-card-hover: rgba(26, 26, 34, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-muted: rgba(79, 70, 229, 0.15);
      --accent-border: rgba(79, 70, 229, 0.35);
      --emerald: #10b981;
      --amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 0%, rgba(79, 70, 229, 0.05) 0%, transparent 60%);
    }

    /* Top Device Mode Switcher */
    .device-switcher-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #09090b;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .device-switcher-bar .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #cbd5e1;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .device-toggle-group {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .device-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .device-toggle-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }

    /* App Viewport Container */
    .app-viewport {
      flex: 1;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      transition: max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .app-viewport.mobile-frame {
      max-width: 440px;
      min-height: auto;
      margin: 12px auto;
      border-radius: 28px;
      border: 4px solid #1e1e24;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      background: var(--bg);
    }

    @media (max-width: 600px) {
      .device-switcher-bar {
        display: none !important;
      }
      .dynamic-island-notch {
        display: none !important;
      }
      .app-viewport.mobile-frame {
        max-width: 100% !important;
        min-height: 100vh !important;
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      .app-content {
        padding: 10px 8px 90px !important;
      }
      .sheet-outer-card {
        padding: 10px 6px !important;
        border-radius: 10px !important;
      }
    }

    .dynamic-island-notch {
      display: none;
      width: 110px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      margin: 8px auto 0;
      position: relative;
      z-index: 60;
    }
    .app-viewport.mobile-frame .dynamic-island-notch {
      display: block;
    }

    /* Minimalist App Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(16px);
      padding: 12px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
    }
    .header-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
    }

    .header-badge-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      background: var(--emerald);
      border-radius: 50%;
    }

    .brand-center {
      text-align: center;
      cursor: pointer;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: white;
    }

    .brand-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      font-weight: 700;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      padding: 16px 20px 115px;
      overflow-y: auto;
    }

    /* Search & Filter Bar */
    .search-container {
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    .search-input-wrap input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px 10px 38px;
      color: white;
      font-size: 13.5px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input-wrap input:focus {
      border-color: rgba(255, 255, 255, 0.25);
      background: var(--bg-surface-elevated);
    }
    .search-input-wrap .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-faint);
      pointer-events: none;
    }

    .filter-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .filter-btn:hover {
      background: var(--bg-surface-elevated);
      color: white;
      border-color: var(--border-hover);
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-heading {
      font-size: 15px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-action-btn {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .section-action-btn:hover { color: white; }

    /* =========================================================
       1. FOLDERS CARDS GRID
       ========================================================= */
    .folders-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .visual-folder-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .visual-folder-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.6);
    }

    .folder-art-cover {
      width: 100%;
      height: 54px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .folder-center-icon {
      font-size: 22px;
      line-height: 1;
      opacity: 0.9;
    }

    .folder-top-pill {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .folder-title-text {
      font-size: 13.5px;
      font-weight: 700;
      color: white;
      line-height: 1.25;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-subtitle-text {
      font-size: 11px;
      color: var(--text-faint);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .folder-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .folder-count-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
    }

    .folder-open-arrow {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
    }

    .folder-card-new-visual {
      border: 1.5px dashed rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 110px;
      border-radius: var(--radius-md);
      transition: all 0.2s;
    }
    .folder-card-new-visual:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.25);
      color: white;
      transform: translateY(-2px);
    }

    /* In-Page Breadcrumb Header */
    .view-breadcrumb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .btn-back-crumb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-back-crumb:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateX(-2px);
    }

    /* Song Cards Grid */
    .song-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .song-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .song-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.6);
    }

    .song-card-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .song-card-key-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .song-star-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: none;
      border: none;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .song-star-btn.active { color: #fbbf24; }

    .song-title-text {
      font-size: 13.5px;
      font-weight: 700;
      color: white;
      margin-bottom: 2px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 10.5px;
    }

    .song-bpm-pill {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
    }

    .pulse-dot {
      width: 5px;
      height: 5px;
      background: #94a3b8;
      border-radius: 50%;
      transition: transform 0.1s, background-color 0.1s;
    }
    .pulse-dot.pulsing {
      background: #818cf8;
      transform: scale(1.6);
    }

    /* =========================================================
       2. SETLISTS & GIG PLANNING STYLES
       ========================================================= */
    .filter-pills-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .filter-pills-row::-webkit-scrollbar { display: none; }

    .pill-filter-item {
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .pill-filter-item.active {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .setlists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .setlist-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .setlist-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.6);
    }

    .setlist-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .setlist-title-text {
      font-size: 15px;
      font-weight: 700;
      color: white;
      line-height: 1.3;
    }

    .setlist-date-text {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .status-badge.scheduled {
      background: #252243;
      border: 1px solid rgba(129, 140, 248, 0.45);
      color: #a5b4fc;
    }
    .status-badge.draft {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #94a3b8;
    }
    .status-badge.archived {
      background: rgba(51, 65, 85, 0.25);
      border: 1px solid rgba(51, 65, 85, 0.4);
      color: #64748b;
    }

    .setlist-song-preview-list {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setlist-preview-item {
      font-size: 12px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 1px 0;
      transition: color 0.15s;
    }
    .setlist-preview-item:hover {
      color: #ffffff;
    }

    .setlist-preview-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 8px;
    }

    .setlist-key-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .setlist-preview-more {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .setlist-preview-more:hover {
      color: #94a3b8;
      text-decoration: underline;
    }

    .setlist-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .setlist-view-flow-link {
      color: #818cf8;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }
    .setlist-view-flow-link:hover {
      color: #a5b4fc;
      transform: translateX(2px);
    }

    /* Gig Planner Flow Bar (Active in Reader) */
    .gig-flow-header-banner {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.28) 0%, rgba(20, 20, 32, 0.98) 100%);
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
      animation: fadeInFlow 0.25s ease;
    }
    @keyframes fadeInFlow {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .gig-flow-tag {
      background: #4f46e5;
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 2.5px 7px;
      border-radius: 4px;
      display: inline-block;
    }
    .btn-flow-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-flow-nav:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn-flow-next {
      background: #6366f1;
      border-color: #818cf8;
    }
    .btn-flow-next:hover {
      background: #4f46e5;
    }
    .btn-flow-exit {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-flow-exit:hover {
      color: #ffffff;
      border-color: #f43f5e;
      background: rgba(244, 63, 94, 0.18);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
      animation: fadeInModal 0.15s ease;
    }
    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-dialog {
      background: #18181f;
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-lg);
      padding: 22px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-input {
      width: 100%;
      background: #0f0f14;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: white;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    .modal-input:focus {
      border-color: var(--accent);
    }
    .modal-songs-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      padding: 6px;
      background: #0e0e12;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .modal-song-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
    }
    .modal-song-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .modal-icons-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .modal-icon-pill {
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-icon-pill:hover, .modal-icon-pill.selected {
      background: var(--accent-muted);
      border-color: var(--accent);
      transform: scale(1.08);
    }
    .modal-tab-group {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .modal-tab-btn {
      flex: 1;
      padding: 6px 10px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-tab-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }

    /* Setlist Flow / Detail Screen */
    .gig-banner {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.15) 0%, rgba(24, 24, 32, 0.9) 100%);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .gig-banner-info h2 {
      font-size: 18px;
      font-weight: 800;
      color: white;
      margin-bottom: 4px;
    }

    .gig-banner-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-live-gig {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transition: all 0.2s;
    }
    .btn-live-gig:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .setlist-flow-queue {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .flow-song-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .flow-song-row:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateX(2px);
    }

    .flow-drag-handle {
      color: var(--text-faint);
      font-size: 16px;
      cursor: grab;
      user-select: none;
    }

    .flow-song-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      width: 20px;
    }

    .flow-song-body {
      flex: 1;
      min-width: 0;
    }

    .flow-song-title {
      font-size: 13.5px;
      font-weight: 700;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flow-song-note {
      font-size: 11px;
      color: #a5b4fc;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flow-badges-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* =========================================================
       3. MUSICAL CHORD GRID SHEET (IMAGE 1 ORGANIZATION)
       ========================================================= */
    .sheet-outer-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6);
      transition: all 0.25s ease;
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      margin-bottom: 14px;
    }

    /* Paper mode toggle (matches Image 1 white paper theme) */
    .sheet-outer-card.paper-theme {
      background: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.05) !important;
    }

    .sheet-header-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 6px;
      position: relative;
    }
    .sheet-outer-card.paper-theme .sheet-header-title-row {
      border-bottom: 1px solid #e2e8f0;
    }

    .sheet-header-spacer {
      width: 36px;
      flex-shrink: 0;
    }

    .sheet-header-center {
      flex: 1;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
    }

    .sheet-header-title {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: clamp(12.5px, 3.2vw, 14.5px);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .sheet-outer-card.paper-theme .sheet-header-title {
      color: #0f172a !important;
    }

    .sheet-header-time {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: clamp(9.5px, 2.4vw, 11px);
      font-weight: 700;
      color: var(--text-muted);
    }
    .sheet-outer-card.paper-theme .sheet-header-time {
      color: #64748b !important;
    }

    .sheet-header-tempo {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(9px, 2.2vw, 10.5px);
      font-weight: 700;
      color: var(--text-muted);
      width: 38px;
      text-align: right;
      flex-shrink: 0;
    }
    .sheet-outer-card.paper-theme .sheet-header-tempo {
      color: #64748b !important;
    }

    /* The Image 1 Grid Line Structure (Fluid Fit Across Screen) */
    .sheet-grid-table {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .sheet-line-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      white-space: nowrap;
      min-height: 22px;
      width: 100%;
      box-sizing: border-box;
    }

    .sheet-line-text-wrap {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 1px 0 6px 0;
      padding-left: clamp(46px, 12.5vw, 54px);
      box-sizing: border-box;
    }

    .sheet-line-text-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(148,163,184,0.4);
      color: inherit;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(10px, 2vw, 11.5px);
      padding: 2px 4px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .sheet-line-text-input::placeholder {
      color: rgba(148,163,184,0.5);
      font-style: italic;
    }

    .sheet-line-text-input:focus {
      border-bottom-color: #818cf8;
      background: rgba(129,140,248,0.05);
      border-radius: 3px;
    }

    .sheet-label-cell {
      width: clamp(46px, 12.5vw, 54px);
      min-width: clamp(46px, 12.5vw, 54px);
      max-width: clamp(46px, 12.5vw, 54px);
      text-align: right;
      padding-right: 3px;
      font-weight: 800;
      font-size: clamp(8.5px, 2.2vw, 10px);
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Section badge colors matching Image 1 */
    .color-a-section { color: #8b5cf6; }
    .color-b-section { color: #d97706; }
    .color-coda      { color: #dc2626; }
    .color-intro     { color: #0284c7; }
    .color-brass     { color: #ffffff; }
    .sheet-outer-card.paper-theme .color-brass { color: #0f172a; }
    .color-song      { color: #e11d48; }
    .color-chorus    { color: #d97706; }
    .color-bg        { color: #059669; }
    .color-ap        { color: #db2777; }

    .sheet-chords-track {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      min-width: 0;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .sheet-bar-symbol {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(8.5px, 2vw, 10px);
      font-weight: 700;
      color: #64748b;
      text-align: center;
      user-select: none;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-bar-symbol.double {
      width: 8px;
      min-width: 8px;
      letter-spacing: -2px;
    }
    .sheet-bar-symbol.single {
      width: 4px;
      min-width: 4px;
      font-weight: 500;
      color: #94a3b8;
    }
    .sheet-outer-card.paper-theme .sheet-bar-symbol {
      color: #64748b;
    }
    .sheet-outer-card.paper-theme .sheet-bar-symbol.single {
      color: #94a3b8;
    }

    .sheet-chord-measure {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: clamp(8.5px, 2.2vw, 11px);
      font-weight: 800;
      color: #ffffff;
      padding: 1px 0.5px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.12s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }
    .sheet-outer-card.paper-theme .sheet-chord-measure {
      color: #0f172a !important;
    }
    .sheet-chord-measure:hover {
      background: rgba(124, 58, 237, 0.12);
    }
    .sheet-chord-measure .chord-root {
      font-weight: 800;
    }
    .sheet-chord-measure sup,
    .sheet-chord-measure .chord-sup {
      font-size: 0.68em;
      font-weight: 700;
      vertical-align: super;
      line-height: 1;
      margin-left: 0.2px;
      color: inherit;
    }

    /* =========================================================
       4. MOBILE CHORD EDITOR VIEW (IMAGE 2 EXACT REPLICA)
       ========================================================= */
    .mobile-editor-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 240px; /* space for keypad */
    }

    /* Top Tempo & Time Boxes */
    .editor-top-meta-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .editor-meta-box {
      background: #15102a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .meta-box-label {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 2px;
    }

    .meta-box-val {
      font-size: 15px;
      font-weight: 800;
      color: white;
    }

    /* Stats Line */
    .editor-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-faint);
      padding: 2px 4px;
      letter-spacing: 0.04em;
    }

    /* Section Editor Block */
    .editor-section-card {
      background: #130f24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .editor-section-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .editor-section-pill-btn {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .editor-section-notes-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #e2e8f0;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
    }
    .editor-section-notes-input:focus {
      border-color: rgba(99, 102, 241, 0.5);
    }

    .editor-del-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
    }
    .editor-del-btn:hover { color: #f43f5e; }

    /* Measure Line Row */
    .editor-measure-line-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .editor-line-bracket {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      padding: 0 2px;
      user-select: none;
    }

    .editor-bars-strip {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .editor-bar-btn {
      background: #18132e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 10px 4px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
    }
    .editor-bar-btn:hover {
      background: #231b42;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Selected Bar Button (Image 2 Glowing Ring) */
    .editor-bar-btn.selected {
      background: #251c4a !important;
      border: 2px solid #a5b4fc !important;
      box-shadow: 0 0 14px rgba(165, 180, 252, 0.45) !important;
      transform: scale(1.02);
    }

    .editor-bar-btn sup {
      font-size: 10px;
      font-weight: 700;
      color: #cbd5e1;
      margin-left: 1px;
    }

    .editor-add-bars-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }

    .editor-add-bars-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .editor-add-bars-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      color: white;
    }

    /* =========================================================
       5. FLOATING BOTTOM CHORD KEYPAD (IMAGE 2 EXACT REPLICA)
       ========================================================= */
    .mobile-keypad-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 120;
      background: #0f0b1e;
      border-top: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.85);
      padding: 10px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 100%;
    }

    .app-viewport.mobile-frame .mobile-keypad-panel {
      position: absolute;
      border-radius: 0 0 32px 32px;
    }

    .keypad-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .keypad-location-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }

    .keypad-pill-tag {
      background: #271a4d;
      color: #a5b4fc;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10.5px;
    }

    .keypad-steppers-group {
      display: flex;
      gap: 4px;
    }

    .keypad-stepper-btn {
      background: #1c1536;
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .keypad-stepper-btn:hover { color: white; background: #271d4a; }

    .keypad-done-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Selected Chord Preview Box */
    .keypad-preview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #150f28;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .keypad-preview-chord {
      font-size: 19px;
      font-weight: 800;
      color: white;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .keypad-cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: #818cf8;
      margin-left: 2px;
      animation: blinkCursor 1s infinite;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .keypad-notes-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* The 4-Row Grid */
    .keypad-buttons-grid-row {
      display: grid;
      gap: 4px;
    }

    .row-roots {
      grid-template-columns: repeat(7, 1fr);
    }
    .row-types {
      grid-template-columns: repeat(7, 1fr);
    }
    .row-exts {
      grid-template-columns: repeat(7, 1fr);
    }
    .row-actions {
      grid-template-columns: 1fr 1fr 1fr 1.2fr 1.6fr;
    }

    .kp-btn {
      background: #1e1738;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-radius: 7px;
      padding: 8px 2px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kp-btn:active {
      transform: scale(0.95);
      background: #31235b;
    }

    .kp-btn.secondary {
      background: #18122c;
      color: #cbd5e1;
      font-size: 12px;
    }

    .kp-btn.accent-del {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.3);
      color: #f43f5e;

    // 0. MUSIC THEORY & TRANSPOSITION UTILITIES
    // =========================================================
    const CHROMATIC_SCALE = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const CHROMATIC_FLATS = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];

    function getSemitoneIndex(note) {
      if (!note) return 0;
      let clean = note.replace('b', '♭');
      let idx = CHROMATIC_FLATS.indexOf(clean);
      if (idx === -1) idx = CHROMATIC_SCALE.indexOf(clean);
      return idx === -1 ? 0 : idx;
    }

    function transposeChordRoot(rootStr, semitones) {
      if (!semitones) return rootStr;
      let clean = rootStr.replace('m', '').replace('7', '').trim();
      let isFlat = clean.includes('♭') || clean.includes('b');

      let idx = CHROMATIC_FLATS.indexOf(clean);
      if (idx === -1) idx = CHROMATIC_SCALE.indexOf(clean);
      if (idx === -1) {
        const normalized = clean.replace('b', '♭');
        idx = CHROMATIC_FLATS.indexOf(normalized);
      }
      if (idx === -1) return rootStr;

      let newIdx = (idx + semitones) % 12;
      if (newIdx < 0) newIdx += 12;

      return isFlat ? CHROMATIC_FLATS[newIdx] : CHROMATIC_SCALE[newIdx];
    }

    function transposeFullChord(chordStr, semitones) {
      if (!semitones || !chordStr) return chordStr;
      return chordStr.replace(/([A-G][b#♭]?)/g, match => transposeChordRoot(match, semitones));
    }

    function formatSingleChordHtml(raw) {
      if (!raw || raw === '-' || raw === '_' || raw === '%') return raw || '';
      if (raw.includes('/')) {
        const parts = raw.split('/');
        return `${formatSingleChordHtml(parts[0])}<span style="opacity: 0.55; margin: 0 1px;">/</span>${formatSingleChordHtml(parts[1])}`;
      }
      const match = raw.match(/^([A-G])([#b♯♭])?(.*)$/);
      if (!match) {
        if (/^[b#♯♭]/.test(raw)) {
          return `<sup>${raw}</sup>`;
        }
        return raw;
      }
      const [, root, accidental, rest] = match;
      const rootStr = root + (accidental || '');

      // Keep minor 'm' (or 'min') on the baseline with chord root (e.g. F#m, C#m, G#m)
      // Only tensions/addon chords (7, dim, 9, b5, sus4, etc.) show in superscript
      let baseQuality = '';
      let superPart = '';

      if (rest) {
        if (rest.startsWith('min')) {
          baseQuality = 'm';
          superPart = rest.slice(3);
        } else if (rest.startsWith('m') && !rest.startsWith('maj')) {
          baseQuality = 'm';
          superPart = rest.slice(1);
        } else {
          superPart = rest;
        }
      }

      if (superPart) {
        return `<span class="chord-root">${rootStr}${baseQuality}</span><sup class="chord-sup">${superPart}</sup>`;
      }
      return `<span class="chord-root">${rootStr}${baseQuality}</span>`;
    }

    function formatChordHtml(measureStr) {
      if (!measureStr || measureStr === '-') return '<span style="opacity: 0.35;">-</span>';
      return measureStr.trim().split(/\s+/).map(formatSingleChordHtml).join(' ');

    // =========================================================
    // 5. MUSIC THEORY, CHORD VOICING & NORMALIZATION ENGINE
    // =========================================================
    const SEMITONES = { "C": 0, "D": 2, "E": 4, "F": 5, "G": 7, "A": 9, "B": 11 };
    const CHROMATIC_SHARP = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
    const CHROMATIC_FLAT  = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];

    function normalizeChordInput(raw) {
      if (!raw || raw === "_" || raw === "%" || raw === "." || raw === "-") return raw;
      return raw
        .replace(/^([A-G])#/i, '$1♯')
        .replace(/^([A-G])b/i, '$1♭')
        .replace(/\/([A-G])#/i, '/$1♯')
        .replace(/\/([A-G])b/i, '/$1♭')
        .replace(/maj7/gi, 'Δ7')
        .replace(/major7/gi, 'Δ7')
        .replace(/maj9/gi, 'Δ9')
        .replace(/m7b5/gi, 'ø7')
        .replace(/m7♭5/gi, 'ø7')
        .replace(/dim7/gi, '°7')
        .replace(/dim/gi, '°')
        .replace(/aug7/gi, '+7')
        .replace(/aug/gi, '+')
        .replace(/b(?=[0-9])/g, '♭')
        .replace(/#(?=[0-9])/g, '♯');
    }

    function calculateVoicing(rawChord) {
      if (!rawChord || rawChord === "%" || rawChord === "." || rawChord === "_" || rawChord === "-") {
        return "";
      }
      const firstChord = rawChord.split(/\s+/)[0];
      const match = firstChord.match(/^([A-G][♯♭#b]?)(.*)$/);
      if (!match) return "";
      const root = match[1].replace("#", "♯").replace("b", "♭");
      const ext = match[2];

      const cleanRoot = root.replace("♯", "").replace("♭", "");
      let basePitch = SEMITONES[cleanRoot] || 0;
      if (root.includes("♯")) basePitch = (basePitch + 1) % 12;
      if (root.includes("♭")) basePitch = (basePitch - 1 + 12) % 12;

      let intervals = [0, 4, 7]; // Major triad
      if (ext.startsWith("m") && !ext.startsWith("maj")) intervals = [0, 3, 7]; // Minor
      if (ext.includes("dim") || ext.includes("°")) intervals = [0, 3, 6];
      if (ext.includes("ø") || ext.includes("m7b5") || ext.includes("m7♭5")) intervals = [0, 3, 6, 10];
      if (ext.includes("aug") || ext.includes("+")) intervals = [0, 4, 8];
      if (ext.includes("sus4")) intervals = [0, 5, 7];
      if (ext.includes("sus2")) intervals = [0, 2, 7];
      if (ext.includes("add9")) intervals = [0, 4, 7, 2];
      if (ext.includes("7") && !ext.includes("maj7") && !ext.includes("Δ") && !ext.includes("ø") && !ext.includes("°7")) {
        intervals.push(10); // Dominant 7th
      } else if (ext.includes("maj7") || ext.includes("Δ") || ext.includes("△")) {
        intervals.push(11); // Major 7th
      } else if (ext.includes("°7") || ext.includes("dim7")) {
        intervals.push(9); // Diminished 7th
      }
      if (ext.includes("6")) intervals.push(9);
      if (ext.includes("9") && !ext.includes("add9")) intervals.push(2);

      const scale = (root.includes("♭") || ['F','B♭','E♭','A♭'].includes(root)) ? CHROMATIC_FLAT : CHROMATIC_SHARP;
      const notes = intervals.map(sem => scale[(basePitch + sem) % 12]);
      return notes.join(" • ");
    }

    let isSlashBassMode = false;
    let isDirectTextMode = false;

    // =========================================================
    // 6. RENDER: IMAGE 2 MOBILE CHORD EDITOR VIEW

          <!-- Stats Line -->
          <div class="editor-stats-row">
            <span>${totalLines} LINES • ${totalBars} BARS TOTAL</span>
          </div>

          <!-- Section Cards Grid (Image 2) -->
          ${song.sections.map((sec, secIdx) => `
            <div class="editor-section-card">

              </div>

              <!-- Lines of Bars -->
              ${sec.lines.map((line, lineIdx) => `
                <div class="editor-measure-line-row">
                  <span class="editor-line-bracket">||</span>
                  
                  <div class="editor-bars-strip">
                    ${line.map((chord, barIdx) => {
                      const isSelected = selectedCell.sectionIdx === secIdx && 
                                         selectedCell.lineIdx === lineIdx && 
                                         selectedCell.barIdx === barIdx;
                      return `
                        <button 
                          class="editor-bar-btn ${isSelected ? 'selected' : ''}"
                          onclick="selectEditorBar(${secIdx}, ${lineIdx}, ${barIdx})"

          <div style="margin-top: 8px;">
            <button class="editor-add-bars-btn" onclick="addNewSection()" style="width: 100%; height: 38px; border-style: solid; border-color: rgba(255,255,255,0.15);">

    }

    // =========================================================
    // 7. RENDER: IMAGE 2 FLOATING CHORD KEYPAD (4 ROWS)
    // =========================================================
    function renderImage2KeypadHtml(song) {

      return `

              style="flex: 1; height: 32px; background: rgba(0,0,0,0.5); border: 1px solid #4f46e5; border-radius: 6px; color: white; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none;"

              onclick="applyStudioDirectText(document.getElementById('studioDirectInput').value)"

          <!-- 4-Row Button Grid (Image 2) -->
          
          <!-- Row 1: Root Notes -->
          <div class="keypad-buttons-grid-row row-roots">

              <button class="kp-btn" onclick="keypadInputRoot('${r}')">${r}</button>
            `).join('')}
          </div>

          <!-- Row 2: Accidentals & Common Qualities -->
          <div class="keypad-buttons-grid-row row-types">
            ${['♯', '♭', 'm', '7', 'maj7', 'sus4', 'dim'].map(q => `
              <button class="kp-btn secondary" onclick="keypadInputExt('${q}')">${q}</button>
            `).join('')}
          </div>

          <!-- Row 3: Extensions -->
          <div class="keypad-buttons-grid-row row-exts">
            ${['aug', '9', '6', 'sus2', 'add9', '/', '%'].map(e => `
              <button class="kp-btn secondary" onclick="keypadInputExt('${e}')">${e}</button>
            `).join('')}
          </div>

          <!-- Row 4: Action Buttons (5 buttons matching Image 3) -->
          <div class="keypad-buttons-grid-row row-actions">
            <button class="kp-btn secondary" onclick="toggleStudioDirectText()">⌨ Text</button>
            <button class="kp-btn secondary" onclick="keypadBackspace()">⌫</button>
            <button class="kp-btn secondary" onclick="keypadInsertBar()">+ Bar</button>
            <button class="kp-btn accent-del" onclick="keypadDeleteChord()">Delete</button>
            <button class="kp-btn accent-next" onclick="stepEditorBar(1)">Next Bar ›</button>

      `;
    }

    // Keypad & Model Update Functions
    function updateSongTitle(title) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      song.title = title;
    }

    function updateSongBpm(bpm) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      song.bpm = parseInt(bpm) || 120;
    }

    function updateSongTime(time) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      song.time = time;
    }

    function updateSectionNotes(secIdx, val) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (song.sections && song.sections[secIdx]) {
        song.sections[secIdx].notes = val;
      }
    }

    function renameSectionPrompt(secIdx) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections || !song.sections[secIdx]) return;
      const cur = song.sections[secIdx].name;
      const next = prompt("Edit section name:", cur);
      if (next !== null && next.trim()) {
        song.sections[secIdx].name = next.trim();
        renderChordReaderView();
        showToast(`Renamed to "${next.trim()}"`);
      }
    }

    function deleteSection(secIdx) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      if (confirm(`Delete entire ${song.sections[secIdx].name}?`)) {
        song.sections.splice(secIdx, 1);
        if (song.sections.length === 0) {
          song.sections.push({ name: "A Section", notes: "", lines: [["-", "-", "-", "-"]] });
        }
        selectedCell.sectionIdx = 0;
        selectedCell.lineIdx = 0;
        selectedCell.barIdx = 0;
        renderChordReaderView();
        showToast("Section removed");
      }
    }

    function deleteLineFromSection(secIdx, lineIdx) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections || !song.sections[secIdx]) return;
      song.sections[secIdx].lines.splice(lineIdx, 1);
      if (song.sections[secIdx].lines.length === 0) {
        song.sections[secIdx].lines.push(["-", "-", "-", "-"]);
      }
      selectedCell.lineIdx = Math.min(lineIdx, song.sections[secIdx].lines.length - 1);
      selectedCell.barIdx = 0;
      renderChordReaderView();
      showToast("4-Bar line deleted");
    }

    function addNewSection() {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) song.sections = [];
      const secNum = song.sections.length + 1;
      song.sections.push({
        name: `Section ${secNum}`,
        notes: "",
        lines: [["-", "-", "-", "-"]]
      });
      renderChordReaderView();
      showToast("New section added");
    }

    function toggleStudioDirectText() {
      isDirectTextMode = !isDirectTextMode;
      renderChordReaderView();
      if (isDirectTextMode) {
        setTimeout(() => {
          const inp = document.getElementById('studioDirectInput');
          if (inp) inp.focus();
        }, 50);
      }
    }

    function applyStudioDirectText(val) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      const cell = song.sections[selectedCell.sectionIdx].lines[selectedCell.lineIdx];
      cell[selectedCell.barIdx] = normalizeChordInput(val.trim());
      isDirectTextMode = false;
      renderChordReaderView();
      showToast(`Set to ${val || 'Empty'}`);
    }

    function selectEditorBar(secIdx, lineIdx, barIdx) {
      selectedCell = { sectionIdx: secIdx, lineIdx, barIdx };
      isSlashBassMode = false;
      renderChordReaderView();
    }

    function stepEditorBar(delta) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      const sections = song.sections || [];
      const currentSec = sections[selectedCell.sectionIdx];
      if (!currentSec) return;
      const currentLine = currentSec.lines[selectedCell.lineIdx];

      let newBar = selectedCell.barIdx + delta;
      if (newBar >= 0 && newBar < currentLine.length) {
        selectedCell.barIdx = newBar;
      } else if (delta > 0 && selectedCell.lineIdx + 1 < currentSec.lines.length) {
        selectedCell.lineIdx++;
        selectedCell.barIdx = 0;
      } else if (delta < 0 && selectedCell.lineIdx - 1 >= 0) {
        selectedCell.lineIdx--;
        selectedCell.barIdx = currentSec.lines[selectedCell.lineIdx].length - 1;
      } else if (delta > 0 && selectedCell.sectionIdx + 1 < sections.length) {
        selectedCell.sectionIdx++;
        selectedCell.lineIdx = 0;
        selectedCell.barIdx = 0;
      } else if (delta < 0 && selectedCell.sectionIdx - 1 >= 0) {
        selectedCell.sectionIdx--;
        const prevSec = sections[selectedCell.sectionIdx];
        selectedCell.lineIdx = prevSec.lines.length - 1;
        selectedCell.barIdx = prevSec.lines[selectedCell.lineIdx].length - 1;
      }
      isSlashBassMode = false;
      renderChordReaderView();
    }

    function keypadInputRoot(root) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      const cell = song.sections[selectedCell.sectionIdx].lines[selectedCell.lineIdx];
      let cur = cell[selectedCell.barIdx] || '';

      if (isSlashBassMode) {
        cell[selectedCell.barIdx] = cur + root;
        isSlashBassMode = false;
      } else if (!cur || cur === '-' || cur === '%') {
        cell[selectedCell.barIdx] = root;
      } else {
        cell[selectedCell.barIdx] = root;
      }
      renderChordReaderView();
      showToast(`Set root: ${root}`);
    }

    function keypadInputExt(ext) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      const cell = song.sections[selectedCell.sectionIdx].lines[selectedCell.lineIdx];
      let cur = cell[selectedCell.barIdx] || 'C';

      if (ext === '/') {
        cell[selectedCell.barIdx] = cur.trim() + '/';
        isSlashBassMode = true;
        renderChordReaderView();
        showToast('Pick bass note (C - B)');
        return;
      }

      let toAppend = ext;
      if (ext === 'maj7') toAppend = 'Δ7';
      else if (ext === 'dim') toAppend = '°';
      else if (ext === 'aug') toAppend = '+';
      else if (ext === 'm7b5') toAppend = 'ø7';
      else if (ext === 'b') toAppend = '♭';
      else if (ext === '#') toAppend = '♯';

      cell[selectedCell.barIdx] = normalizeChordInput(cur + toAppend);
      renderChordReaderView();
      showToast(`Added: ${toAppend}`);
    }

    function keypadBackspace() {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      const cell = song.sections[selectedCell.sectionIdx].lines[selectedCell.lineIdx];
      let cur = cell[selectedCell.barIdx] || 'C';
      if (cur.length > 1) {
        cell[selectedCell.barIdx] = cur.slice(0, -1);
      } else {
        cell[selectedCell.barIdx] = '-';
      }
      renderChordReaderView();
    }

    function keypadInsertBar() {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      const line = song.sections[selectedCell.sectionIdx].lines[selectedCell.lineIdx];
      line.splice(selectedCell.barIdx + 1, 0, '-');
      selectedCell.barIdx++;
      renderChordReaderView();
      showToast('+1 Bar inserted');
    }

    function keypadDeleteChord() {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      const line = song.sections[selectedCell.sectionIdx].lines[selectedCell.lineIdx];
      if (line.length > 1) {
        line.splice(selectedCell.barIdx, 1);
        selectedCell.barIdx = Math.max(0, selectedCell.barIdx - 1);
        showToast('Bar deleted');
      } else {
        line[0] = '-';
        showToast('Bar cleared');
      }
      renderChordReaderView();
    }

    function addBarsToSection(secIdx, count) {
      const song = SONGS.find(s => s.id === currentSongId) || SONGS[0];
      if (!song.sections) return;
      const newBars = Array(count).fill('-');
      song.sections[secIdx].lines.push(newBars);
      renderChordReaderView();
      showToast(`Added ${count} bars to section`);
    }

    function switchSongTab(songId) {
      currentSongId = songId;
      transposeOffset = 0;
      renderChordReaderView();
    }

    function closeSongTab(songId) {
      openTabs = openTabs.filter(id => id !== songId);
      if (openTabs.length === 0) openTabs = [101];
      if (currentSongId === songId) currentSongId = openTabs[0];
      renderChordReaderView();
    }

    function openQuickSongPicker() {
      const unopen = SONGS.filter(s => !openTabs.includes(s.id));
      if (unopen.length > 0) {
        openTabs.push(unopen[0].id);
        currentSongId = unopen[0].id;
        renderChordReaderView();
        showToast(`Opened tab: ${unopen[0].title}`);
      }
    }

    function stepTranspose(delta) {
      transposeOffset += delta;
      if (transposeOffset > 11) transposeOffset = -11;
      if (transposeOffset < -11) transposeOffset = 11;
      const song = SONGS.find(s => s.id === currentSongId);
      const newKey = transposeChordRoot(song.key, transposeOffset);
      renderChordReaderView();
      showToast(`Key transposed to ${newKey} (${transposeOffset >= 0 ? '+' : ''}${transposeOffset} st)`);
    }

    // =========================================================
    // 7. VIEWS: FOLDERS, SETLISTS, STARRED, LYRICS
    // =========================================================
    function updateFolderCounts() {
      FOLDERS.forEach(f => {
        f.count = SONGS.filter(s => s.folderId === f.id).length;
      });
      LYRICS_FOLDERS.forEach(lf => {
        lf.count = LYRICS_SHEETS.filter(ls => ls.folderId === lf.id).length;
      });
    }

    function renderFoldersView() {
      updateFolderCounts();
      const mount = document.getElementById('viewMountPoint');

      mount.innerHTML = `
        <div class="search-container">
          <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search folders or songs..." id="searchInput" oninput="handleSearch(this.value)" />
          </div>
          <button class="filter-btn" onclick="openCreateFolderModal()">+ Folder</button>
        </div>

        <div class="section-header-row">

                <div class="folder-center-icon">${f.icon}</div>
              </div>

                <div class="folder-title-text">${escapeHtml(f.name)}</div>
                <div class="folder-subtitle-text">${f.updated}</div>
              </div>
              <div class="folder-footer-row">
                <span class="folder-count-badge">${f.count} Charts</span>
                <div class="folder-open-arrow">→</div>
              </div>

          <div class="folder-card-new-visual" onclick="openCreateFolderModal()">
            <div style="font-size: 26px;">📁+</div>
            <div style="font-weight: 700; font-size: 13.5px; color: white;">Create Folder</div>
            <div style="font-size: 11px; color: var(--text-muted);">Organize your charts</div>
          </div>
        </div>
      `;
    }

      switchView('inside_folder', { folderId });

      modal.innerHTML = `

            <span>📁 Create New Song Folder</span>
            <button style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;" onclick="closeCreateFolderModal()">✕</button>
          </div>

    function openSetlistFlow(setId, songIndex = 0) {
      const setlist = SETLISTS.find(s => s.id === setId);
      if (!setlist || !setlist.songs || setlist.songs.length === 0) return;
      activeSetlistFlow = {
        setlistId: setId,
        songIndex: Math.max(0, Math.min(songIndex, setlist.songs.length - 1))
      };
      const targetSong = setlist.songs[activeSetlistFlow.songIndex];
      switchView('chord_reader', { songId: targetSong.id });
      showToast(`Setlist Flow: ${setlist.title} (${activeSetlistFlow.songIndex + 1}/${setlist.songs.length})`);
    }

    function openSetlistSong(setId, songIndex) {
      openSetlistFlow(setId, songIndex);
    }

    function nextSetlistSong() {
      if (!activeSetlistFlow) return;
      const setlist = SETLISTS.find(s => s.id === activeSetlistFlow.setlistId);
      if (!setlist) return;
      if (activeSetlistFlow.songIndex < setlist.songs.length - 1) {
        activeSetlistFlow.songIndex++;
        const nextSong = setlist.songs[activeSetlistFlow.songIndex];
        currentSongId = nextSong.id;
        if (!openTabs.includes(nextSong.id)) openTabs.push(nextSong.id);
        transposeOffset = 0;
        renderChordReaderView();
        showToast(`Next Song: ${nextSong.title} (Key ${nextSong.key})`);
      }
    }

    function prevSetlistSong() {
      if (!activeSetlistFlow) return;
      const setlist = SETLISTS.find(s => s.id === activeSetlistFlow.setlistId);
      if (!setlist) return;
      if (activeSetlistFlow.songIndex > 0) {
        activeSetlistFlow.songIndex--;
        const prevSong = setlist.songs[activeSetlistFlow.songIndex];
        currentSongId = prevSong.id;
        if (!openTabs.includes(prevSong.id)) openTabs.push(prevSong.id);
        transposeOffset = 0;
        renderChordReaderView();
        showToast(`Prev Song: ${prevSong.title} (Key ${prevSong.key})`);
      }
    }

    function saveNewSetlist() {
      const titleInput = document.getElementById('newSetlistTitle');
      const dateInput = document.getElementById('newSetlistDate');
      const timeInput = document.getElementById('newSetlistTime');
      const statusInput = document.getElementById('newSetlistStatus');
      const checkedBoxes = document.querySelectorAll('.modal-songs-picker input[type="checkbox"]:checked');

      const title = (titleInput && titleInput.value.trim()) || 'Untitled Setlist';
      const date = (dateInput && dateInput.value.trim()) || 'Jun 2026';
      const time = (timeInput && timeInput.value.trim()) || '7:00 PM';
      const status = (statusInput && statusInput.value) || 'scheduled';

      const selectedSongIds = Array.from(checkedBoxes).map(cb => parseInt(cb.value, 10));
      const pickedSongs = selectedSongIds.map(sid => {
        const s = SONGS.find(song => song.id === sid);
        return s ? { id: s.id, title: s.title, key: s.key } : null;
      }).filter(Boolean);

      if (pickedSongs.length === 0) {
        pickedSongs.push({ id: SONGS[0].id, title: SONGS[0].title, key: SONGS[0].key });
      }

      const newSet = {
        id: 'set-' + Date.now(),
        title,
        status,
        date,
        time,
        duration: `${pickedSongs.length * 6} min`,
        songs: pickedSongs
      };

      SETLISTS.unshift(newSet);
      closeNewSetlistModal();
      renderSetlistsView();
      showToast(`Created setlist "${title}"`);
