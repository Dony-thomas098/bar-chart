<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chordly Loader</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--ink:#f4f2f0;--mute:#9a97a0;--o1:#f9d3ae;--o2:#f3a05a;--o3:#e8742c;--o4:#d9501c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:radial-gradient(75% 55% at 88% 10%,#6e4c35 0%,rgba(110,76,53,.35) 42%,transparent 72%),radial-gradient(90% 50% at 50% 105%,#1a1a1f 0%,transparent 70%),var(--bg)}
.mark-wrap{position:relative;width:min(78vw,340px);aspect-ratio:1}
svg.mark{width:100%;height:100%;overflow:visible;display:block}
.thin{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1}
.shock{fill:none;stroke:var(--o2);stroke-width:2;vector-effect:non-scaling-stroke;transform-origin:200px 200px;opacity:0;animation:shock 8s ease-out infinite}
.shock.s2{animation-delay:.16s;stroke:var(--o1);opacity:0}
@keyframes shock{0%{transform:scale(.7);opacity:.9}24%{transform:scale(3.6);opacity:0}100%{transform:scale(3.6);opacity:0}}
.arc{fill:none;stroke-linecap:round;stroke-width:13;transform-origin:200px 200px;stroke-dasharray:68 32;
animation:fwd 4.2s cubic-bezier(.65,0,.35,1) infinite,breathe 2.8s ease-in-out infinite alternate}
.a1{stroke:var(--o1);animation-duration:3.6s,2.4s}
.a2{stroke:var(--o2);animation-name:rev,breathe;animation-duration:4.4s,2.9s}
.a3{stroke:var(--o3);animation-duration:5.2s,3.2s}
.a4{stroke:var(--o4);animation-name:rev,breathe;animation-duration:6s,3.6s}
@keyframes fwd{0%{transform:rotate(58deg)}35%{transform:rotate(238deg)}60%{transform:rotate(288deg)}100%{transform:rotate(418deg)}}
@keyframes rev{0%{transform:rotate(58deg)}35%{transform:rotate(-122deg)}60%{transform:rotate(-172deg)}100%{transform:rotate(-302deg)}}
@keyframes breathe{from{stroke-dasharray:70 30}to{stroke-dasharray:54 46}}
.dot{fill:#fff;transform-origin:200px 200px;animation:pulse 1.6s ease-in-out infinite}
.halo{transform-origin:200px 200px;animation:pulse 1.6s ease-in-out infinite;opacity:.8}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
.flare{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.fl{position:absolute;opacity:0;animation:flare 8s linear infinite}
.fl i{position:absolute;top:-1px;left:-50vw;width:100vw;height:2px;background:linear-gradient(90deg,transparent,rgba(255,214,160,.95) 50%,transparent)}
.fl b{position:absolute;top:-55px;left:-55px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,200,130,.75) 18%,rgba(255,150,70,.18) 45%,transparent 70%)}
@keyframes flare{0%,50%{opacity:0;transform:translateX(-60vw)}56%{opacity:1;transform:translateX(-32vw)}72%{opacity:1;transform:translateX(34vw)}80%,100%{opacity:0;transform:translateX(60vw)}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.brand{margin-top:22px;font-size:40px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.brand span{color:#ff6a1f}
.status{margin-top:8px;font-size:15px;color:var(--mute);letter-spacing:.04em}
.status i{font-style:normal;animation:dots 1.4s infinite;opacity:.2}
.status i:nth-child(2){animation-delay:.2s}.status i:nth-child(3){animation-delay:.4s}
@keyframes dots{0%,60%,100%{opacity:.2}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.arc,.shock,.fl,.dot,.halo{animation:none}.arc{transform:rotate(58deg)}.shock,.fl{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="fx"></canvas>
  <div class="mark-wrap" id="mark">
    <svg class="mark" viewBox="0 0 400 400" aria-hidden="true">
      <defs><radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      <circle class="thin" cx="200" cy="200" r="138"/><circle class="thin" cx="200" cy="200" r="162"/>
      <circle class="shock" cx="200" cy="200" r="60"/><circle class="shock s2" cx="200" cy="200" r="60"/>
      <circle class="arc a4" cx="200" cy="200" r="116" pathLength="100"/>
      <circle class="arc a3" cx="200" cy="200" r="92" pathLength="100"/>
      <circle class="arc a2" cx="200" cy="200" r="68" pathLength="100"/>
      <circle class="arc a1" cx="200" cy="200" r="44" pathLength="100"/>
      <circle class="halo" cx="200" cy="200" r="26" fill="url(#core)"/>
      <circle class="dot" cx="200" cy="200" r="9"/>
    </svg>
    <div class="flare"><div class="fl"><i></i><b></b></div></div>
  </div>
  <div class="brand">chord<span>ly</span></div>
  <div class="status" role="status" aria-live="polite">Synchronizing your catalog<i>.</i><i>.</i><i>.</i></div>
</div>
<script>
(function(){
  var cv=document.getElementById("fx"),ctx=cv.getContext("2d"),mark=document.getElementById("mark");
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dpr=Math.min(devicePixelRatio||1,2),P=[],fired=false,t0=performance.now(),last=t0,cx=0,cy=0,scale=1;
  var cols=["#fff","#ffd9b0","#f3a05a","#e8742c","#ff8a4a"];
  function size(){var r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;
    var m=mark.getBoundingClientRect();cx=(m.left+m.width/2-r.left)*dpr;cy=(m.top+m.height/2-r.top)*dpr;scale=m.width/400*dpr}
  addEventListener("resize",size);size();
  function burst(){
    for(var i=0;i<90;i++){
      var a=Math.random()*Math.PI*2,r=(30+Math.random()*95)*scale;
      P.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:Math.cos(a+.9)*(20+Math.random()*60)*scale,vy:Math.sin(a+.9)*(20+Math.random()*60)*scale,
        ox:Math.cos(a)*(40+Math.random()*140)*scale,oy:Math.sin(a)*(40+Math.random()*140)*scale,
        s:(.8+Math.random()*2.6)*dpr,life:0,max:1.4+Math.random()*1.4,c:cols[i%cols.length]});
    }
  }
  function frame(now){
    var dt=Math.min((now-last)/1000,.05);last=now;
    var ph=(now-t0)%8000;
    if(!reduce){
      if(ph>5500&&ph<5700&&!fired){fired=true;burst()}
      if(ph<1000)fired=false;
    }
    ctx.clearRect(0,0,cv.width,cv.height);
    if(P.length){
      ctx.globalCompositeOperation="lighter";
      for(var i=P.length-1;i>=0;i--){
        var p=P[i];p.life+=dt;if(p.life>p.max){P.splice(i,1);continue}
        var k=p.life/p.max;
        p.x+=(p.vx+p.ox*.35)*dt;p.y+=(p.vy+p.oy*.35)*dt;
        ctx.globalAlpha=Math.sin(Math.min(k*3,1)*Math.PI/2)*(1-k);
        ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1-k*.5),0,6.283);ctx.fill();
      }
      ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
